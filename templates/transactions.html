{% extends "base.html" %}
{% block title %}Transactions{% endblock %}

{% block content %}
<h1 class="page-title">Historique des transactions</h1>

<div class="filter-bar">
    <button type="button" class="filter-btn active" data-fake-filter="7j">7 jours</button>
    <button type="button" class="filter-btn" data-fake-filter="30j">30 jours</button>
    <button type="button" class="filter-btn" data-fake-filter="90j">90 jours</button>
    <button type="button" class="filter-btn" data-fake-filter="all">Tout</button>
    <select id="real-period" class="tiny-select text-hostile">
        <option value="all">période</option>
        <option value="7">7j</option>
        <option value="30">30j</option>
    </select>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Actif</th>
                <th>Montant</th>
                <th>Valeur</th>
                <th>Statut</th>
            </tr>
        </thead>
        <tbody id="tx-body"></tbody>
    </table>
    <p class="search-hint text-hostile">
        Les boutons de période ne filtrent pas. Utilisez le menu « période ».
    </p>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/transactions.js') }}"></script>
{% endblock %}
